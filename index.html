<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>PRO AI HD</title>
<style>*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#000;color:#fff;display:flex;justify-content:center;padding:12px}.box{width:100%;max-width:460px;background:#111;border-radius:24px;padding:20px;border:1px solid #222}h1{text-align:center}.up{border:2px dashed #333;padding:30px;border-radius:16px;text-align:center;background:#151515;cursor:pointer}.up input{display:none}#result{width:100%;border-radius:16px;margin-top:15px;display:none}.btn{width:100%;padding:15px;border:none;border-radius:12px;font-weight:800;margin-top:12px;cursor:pointer}#enhanceBtn{background:#fff;color:#000;font-size:17px}#downBtn{background:#222;color:#fff;display:none}.loader{display:none;text-align:center;margin-top:15px;color:#888}</style>
</head><body><div class="box"><h1>ULTRA AI HD</h1><p style="text-align:center;color:#666;font-size:12px">Real-ESRGAN 4X</p>
<label class="up" for="fileInput">📸 Tasveer Upload Karein<input type="file" id="fileInput" accept="image/*"></label>
<div class="loader" id="loader">⏳ AI 15-30 sec...</div><img id="result"><button class="btn" id="enhanceBtn" style="display:none">✨ AI SE 4X HD BANAO</button><button class="btn" id="downBtn">⬇️ DOWNLOAD</button></div>
<script>let base64="";const fileInput=document.getElementById('fileInput'),result=document.getElementById('result'),loader=document.getElementById('loader'),enhanceBtn=document.getElementById('enhanceBtn'),downBtn=document.getElementById('downBtn');fileInput.onchange=e=>{const f=e.target.files[0];const r=new FileReader();r.onload=ev=>{base64=ev.target.result;result.src=base64;result.style.display='block';enhanceBtn.style.display='block';};r.readAsDataURL(f);};enhanceBtn.onclick=async()=>{loader.style.display='block';enhanceBtn.disabled=true;enhanceBtn.innerText="Processing...";const res=await fetch('/api/enhance',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:base64})});const data=await res.json();if(data.output){result.src=data.output;downBtn.style.display='block';downBtn.onclick=()=>{const a=document.createElement('a');a.href=data.output;a.download='AI-HD-4X.png';a.click();};loader.style.display='none';enhanceBtn.innerText="✅ HO GAYA";enhanceBtn.disabled=false;}else{alert("Error: "+JSON.stringify(data));loader.style.display='none';enhanceBtn.disabled=false;}};</script></body></html>
